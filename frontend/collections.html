<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collections — Harmonizer Labs</title>
  <meta name="description" content="Every live thing in Harmonizer Labs, in one index.">
  <script>
    (function () {
      try {
        document.documentElement.dataset.theme = localStorage.getItem('hl-theme') === 'light' ? 'day' : 'night';
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="https://unpkg.com/pixelarticons@1.8.1/fonts/pixelart-icons-font.css">
  <style>
    :root{
      --serif:"Times New Roman",Times,"Liberation Serif",serif;
      --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
      --mono:"Courier New",ui-monospace,Consolas,monospace;
      --bg:#07080c;
      --ink:#f2efe6;
      --dim:#9a9daa;
      --line:rgba(242,239,230,.16);
      --accent:#7ea2ff;
      --tint:rgba(126,162,255,.055);
      color-scheme:dark;
    }
    :root[data-theme="day"]{
      --bg:#ece6d8;
      --ink:#141519;
      --dim:#5f5d56;
      --line:rgba(20,21,25,.18);
      --accent:#1d3ecf;
      --tint:rgba(29,62,207,.05);
      color-scheme:light;
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{
      min-height:100dvh;
      background:var(--bg);
      color:var(--ink);
      font-family:var(--sans);
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit;text-decoration:none}
    button,input{font:inherit;color:inherit}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
    .skip{position:fixed;left:16px;top:-48px;z-index:20;padding:8px 12px;background:var(--bg);border:1px solid var(--ink);color:var(--ink)}
    .skip:focus{top:16px}
    :focus-visible{outline:1px solid var(--accent);outline-offset:4px}

    .page{
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      padding:0 clamp(20px,4vw,56px);
    }

    .meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      padding:18px 0 16px;
      border-bottom:1px solid var(--line);
      font-family:var(--mono);
      font-size:10px;
      letter-spacing:.2em;
      text-transform:uppercase;
      color:var(--dim);
    }
    .meta-left,.meta-right{display:flex;align-items:center;gap:12px;min-width:0}
    .meta .mark{
      display:inline-flex;align-items:center;justify-content:center;
      width:22px;height:22px;border:1px solid var(--line);color:var(--ink);
      font-size:9px;letter-spacing:.04em;
    }
    .meta .sep{opacity:.45}
    .meta b{font-weight:400;color:var(--ink)}
    .meta a:hover{color:var(--accent)}
    .power{
      display:inline-flex;align-items:center;gap:8px;
      margin-left:10px;padding:4px 0;background:none;border:0;color:var(--dim);
      font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;
    }
    .power:hover{color:var(--ink)}
    .power .dot{position:relative;width:16px;height:16px;border:1px solid var(--line);border-radius:50%;overflow:hidden}
    .power .dot::after{
      content:"";position:absolute;inset:0;background:var(--accent);
      clip-path:inset(0 0 50% 0);transition:clip-path .45s cubic-bezier(.2,.8,.2,1);
    }
    :root[data-theme="day"] .power .dot::after{clip-path:inset(50% 0 0 0)}

    main{flex:1;padding:clamp(32px,6vh,64px) 0 clamp(40px,6vh,72px)}
    .title{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:32px;
      padding-bottom:clamp(24px,4vh,40px);
      border-bottom:1px solid var(--line);
    }
    .title-main{min-width:0}
    .kicker{
      margin:0 0 clamp(14px,2.4vh,24px);
      font-family:var(--mono);
      font-size:10px;
      letter-spacing:.3em;
      text-transform:uppercase;
      color:var(--dim);
    }
    h1{
      view-transition-name:masthead;
      margin:0;
      font-family:var(--serif);
      font-weight:700;
      font-size:clamp(46px,10vw,132px);
      line-height:.82;
      letter-spacing:-.04em;
      text-transform:uppercase;
    }
    .sub{
      margin:18px 0 0;
      max-width:46ch;
      font-size:14px;
      line-height:1.5;
      color:var(--dim);
    }
    .sub b{font-weight:400;color:var(--ink)}
    .search{align-self:flex-end;min-width:200px;max-width:280px}
    .search input{
      width:100%;
      padding:7px 0;
      background:none;
      border:0;
      border-bottom:1px solid var(--line);
      color:var(--ink);
      font-family:var(--mono);
      font-size:11px;
      letter-spacing:.05em;
    }
    .search input::placeholder{color:var(--dim)}
    .search input:focus{outline:none;border-color:var(--accent)}
    .search .hint{
      display:block;
      margin-top:6px;
      font-family:var(--mono);
      font-size:8.5px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--dim);
    }

    .layout{
      display:grid;
      grid-template-columns:190px minmax(0,1fr);
      gap:clamp(28px,5vw,72px);
      padding-top:clamp(24px,4vh,40px);
      align-items:start;
    }

    .rail{position:sticky;top:24px}
    .rail-label{
      margin:0 0 12px;
      font-family:var(--mono);
      font-size:9px;
      letter-spacing:.28em;
      text-transform:uppercase;
      color:var(--dim);
    }
    .rail-list{display:flex;flex-direction:column;gap:2px}
    .rail button{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:10px;
      width:100%;
      padding:7px 0;
      background:none;
      border:0;
      border-bottom:1px solid transparent;
      color:var(--dim);
      text-align:left;
      font-size:12.5px;
      cursor:pointer;
    }
    .rail button:hover{color:var(--ink)}
    .rail button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
    .rail button[aria-pressed="true"] .n{color:var(--accent)}
    .rail .n{font-family:var(--mono);font-size:9.5px;color:var(--dim)}
    .rail-note{
      margin:22px 0 0;
      padding-top:14px;
      border-top:1px solid var(--line);
      font-family:var(--mono);
      font-size:9px;
      line-height:1.7;
      letter-spacing:.02em;
      color:var(--dim);
    }

    .index{min-width:0}
    .group{margin:0 0 clamp(28px,4vh,44px)}
    .group-head{
      display:flex;
      align-items:baseline;
      gap:12px;
      margin:0 0 4px;
      padding-bottom:8px;
      font-family:var(--mono);
      font-size:9px;
      letter-spacing:.26em;
      text-transform:uppercase;
      color:var(--dim);
    }
    .group-head h2{margin:0;font:inherit;color:var(--accent)}
    .group-head .count{margin-left:auto}

    .item{
      position:relative;
      display:grid;
      grid-template-columns:30px minmax(120px,210px) minmax(0,1fr) auto 26px;
      grid-template-areas:"no name note end ico";
      align-items:center;
      gap:14px;
      padding:11px 8px 11px 0;
      border-bottom:1px solid var(--line);
      transition:background .16s;
    }
    .item:hover,.item:focus-within{background:var(--tint)}
    .item .hit{position:absolute;inset:0;z-index:1}
    .item .hit:focus-visible{outline:1px solid var(--accent);outline-offset:-1px}
    .item .no{grid-area:no;font-family:var(--mono);font-size:9px;color:var(--dim)}
    .item .name{grid-area:name;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .16s,transform .16s}
    .item .note{grid-area:note;font-size:12px;line-height:1.4;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item .end{grid-area:end;display:flex;flex-direction:column;align-items:flex-end;gap:3px;position:relative;z-index:2}
    .item .gate{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
    .item .more{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
    .item .more:hover{text-decoration:underline;text-underline-offset:2px}
    .item .ico{grid-area:ico;display:flex;align-items:center;justify-content:center;width:26px;height:26px;filter:none;opacity:.9;background:color-mix(in srgb,var(--ink) 5%,transparent);border-radius:2px;transition:filter .18s,opacity .18s}
    .item .ico img{width:24px;height:24px;object-fit:contain;display:block}
    .item .ico i{font-size:17px;line-height:1;color:var(--ink)}
    .item:hover .name,.item:focus-within .name{color:var(--accent);transform:translateX(3px)}
    .item:hover .ico,.item:focus-within .ico{filter:none;opacity:1}

    .empty{
      padding:28px 0;
      border-bottom:1px solid var(--line);
      font-family:var(--mono);
      font-size:11px;
      color:var(--dim);
    }

    .foot{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      padding:16px 0 22px;
      border-top:1px solid var(--line);
      font-family:var(--mono);
      font-size:9px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--dim);
    }

    @media (max-width:820px){
      .layout{grid-template-columns:1fr;gap:26px}
      .rail{position:static}
      .rail-list{flex-direction:row;flex-wrap:wrap;gap:6px 16px}
      .rail button{width:auto;padding:4px 0}
      .rail-note{margin-top:16px}
      .title{flex-direction:column;align-items:flex-start;gap:20px}
      .search{align-self:stretch;max-width:none;width:100%}
      .item{
        grid-template-columns:24px minmax(0,1fr) 26px;
        grid-template-areas:"no name ico" ". note note" ". end end";
        row-gap:2px;
        padding:10px 4px 10px 0;
      }
      .item .end{flex-direction:row;align-items:center;gap:10px}
      .item .note{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    }
    @media (max-width:620px){
      .meta{font-size:9px;letter-spacing:.14em;gap:12px}
      .meta .room,.meta .sep,#live-count{display:none}
      .power{margin-left:2px}
      h1{font-size:clamp(34px,12.2vw,76px)}
      .sub{font-size:13px}
      .foot{align-items:flex-start;flex-direction:column;gap:8px}
      .item .name{font-size:13.5px}
      .group-head span:not(.count){display:none}
    }
    @media (prefers-reduced-motion:reduce){
      *{animation:none!important;transition:none!important}
    }
    @supports (view-transition-name:none){
      @view-transition{navigation:auto}
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to collections</a>
  <div class="page">
    <header class="meta">
      <div class="meta-left">
        <span class="mark" aria-hidden="true">HL</span>
        <span><b>Harmonizer Labs</b></span>
        <span class="sep" aria-hidden="true">/</span>
        <span class="room">Collections</span>
      </div>
      <div class="meta-right">
        <span id="live-count"></span>
        <span class="sep" aria-hidden="true">/</span>
        <a href="/">Desktop</a>
        <button class="power" id="theme" type="button" aria-label="Switch to daylight">
          <span class="dot" aria-hidden="true"></span>
          <span class="label">Night</span>
        </button>
      </div>
    </header>

    <main id="main">
      <section class="title">
        <div class="title-main">
          <p class="kicker">Harmonizer Labs / Catalogue</p>
          <h1>Collections</h1>
          <p class="sub"><b id="count"></b> Four collections. Six retired from the site.</p>
        </div>
        <div class="search">
          <label class="sr-only" for="q">Filter the collections</label>
          <input id="q" type="search" placeholder="Filter name or route" autocomplete="off" spellcheck="false">
          <span class="hint">/ to focus · esc to clear</span>
        </div>
      </section>

      <div class="layout">
        <aside class="rail">
          <p class="rail-label">Filter</p>
          <div class="rail-list" id="rail">
            <button type="button" data-filter="all" aria-pressed="true">All <span class="n"></span></button>
          </div>
          <p class="rail-note">Retired: CameraRoom, Night Library, Eldrichify, CodeSniff, Notebook, Quick Reference.</p>
        </aside>
        <section class="index" id="list" aria-live="polite"></section>
      </div>
    </main>

    <footer class="foot">
      <span id="status">—</span>
      <span>harmonizerlabs.cc</span>
    </footer>
  </div>

  <script src="/js/collections-data.js"></script>
  <script>
    (function () {
      'use strict';
      const data = window.HL_COLLECTIONS;
      if (!data) return;
      const { collections, items, gates } = data;
      const list = document.getElementById('list');
      const rail = document.getElementById('rail');
      const countEl = document.getElementById('count');
      const statusEl = document.getElementById('status');
      const q = document.getElementById('q');
      const liveCount = document.getElementById('live-count');
      let active = 'all';

      const byCollection = new Map(collections.map((c) => [c.id, c]));
      const esc = (s) => String(s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
      const iconMarkup = (item) => item.icon.type === 'img'
        ? `<img src="${esc(item.icon.value)}" alt="" loading="lazy" draggable="false">`
        : `<i class="${esc(item.icon.value)}" aria-hidden="true"></i>`;
      const routeLabel = (item) => {
        if (item.external) { try { return new URL(item.href).host; } catch (e) { return item.href; } }
        return item.href;
      };

      let num = 0;
      const itemMarkup = (item) => {
        num += 1;
        const external = item.external ? ' target="_blank" rel="noopener"' : '';
        const more = item.more
          ? `<a class="more" href="${esc(item.more.href)}" target="_blank" rel="noopener">${esc(item.more.label)} &nearr;</a>`
          : '';
        return `<div class="item">
          <a class="hit" href="${esc(item.href)}"${external} aria-label="Open ${esc(item.name)} (${esc(routeLabel(item))})"></a>
          <span class="no">${String(num).padStart(2, '0')}</span>
          <span class="name">${esc(item.name)}</span>
          <span class="note">${esc(item.note)}</span>
          <span class="end">${more}<span class="gate">${esc(gates[item.gate] || item.gate)}</span></span>
          <span class="ico" aria-hidden="true">${iconMarkup(item)}</span>
        </div>`;
      };

      const matches = (item) => {
        if (active !== 'all' && item.collection !== active) return false;
        const term = q.value.trim().toLowerCase();
        if (!term) return true;
        return `${item.name} ${item.note} ${item.href} ${byCollection.get(item.collection).name}`.toLowerCase().includes(term);
      };

      const render = () => {
        num = 0;
        const shown = items.filter(matches);
        const grouped = active === 'all' && !q.value.trim();
        const blocks = grouped
          ? collections.map((c) => ({ c, rows: shown.filter((i) => i.collection === c.id) })).filter((g) => g.rows.length)
          : [{ c: null, rows: shown }];

        list.innerHTML = blocks.length
          ? blocks.map(({ c, rows }) => {
              const head = c
                ? `<div class="group-head"><h2>${esc(c.name)}</h2><span>${esc(c.note)}</span><span class="count">${rows.length}</span></div>`
                : '';
              return `<section class="group">${head}${rows.map(itemMarkup).join('')}</section>`;
            }).join('')
          : '<p class="empty">Nothing matches that. Esc to clear.</p>';

        countEl.textContent = `${items.length} live things.`;
        liveCount.textContent = `${items.length} live`;
        statusEl.textContent = `${shown.length} of ${items.length}${active === 'all' ? '' : ` · ${byCollection.get(active).name}`}${q.value.trim() ? ` · “${q.value.trim()}”` : ''}`;

        rail.querySelectorAll('[data-filter]').forEach((tab) => {
          tab.setAttribute('aria-pressed', String(tab.dataset.filter === active));
          const n = tab.querySelector('.n');
          if (n) n.textContent = String(tab.dataset.filter === 'all' ? items.length : items.filter((i) => i.collection === tab.dataset.filter).length);
        });
      };

      collections.forEach((c) => {
        const tab = document.createElement('button');
        tab.type = 'button';
        tab.dataset.filter = c.id;
        tab.setAttribute('aria-pressed', 'false');
        tab.innerHTML = `${esc(c.name)} <span class="n"></span>`;
        rail.appendChild(tab);
      });

      rail.addEventListener('click', (e) => {
        const tab = e.target.closest('[data-filter]');
        if (!tab) return;
        active = tab.dataset.filter;
        render();
      });
      q.addEventListener('input', render);
      q.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { q.value = ''; render(); q.blur(); }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
      });

      const root = document.documentElement;
      const btn = document.getElementById('theme');
      const paint = () => {
        const day = root.dataset.theme === 'day';
        btn.querySelector('.label').textContent = day ? 'Day' : 'Night';
        btn.setAttribute('aria-label', day ? 'Switch to night' : 'Switch to daylight');
      };
      btn.addEventListener('click', () => {
        root.dataset.theme = root.dataset.theme === 'day' ? 'night' : 'day';
        try { localStorage.setItem('hl-theme', root.dataset.theme === 'day' ? 'light' : 'dark'); } catch (e) {}
        paint();
      });
      paint();
      render();
    })();
  </script>
</body>
</html>
