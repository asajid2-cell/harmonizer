<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Crate — Harmonizer Labs</title>
  <meta name="description" content="Run 06 of the Harmonizer Labs landing: nineteen records in a spinning crate. Drag to browse, click a record, and the whole lab opens.">
  <script>
    (function () {
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('hl-theme') === 'light' ? 'day' : 'night';
      } catch (e) {}
    })();
  </script>
  <style>
    :root{
      --serif:"Times New Roman",Times,"Liberation Serif",serif;
      --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
      --mono:"Courier New",ui-monospace,Consolas,monospace;

      --bg:#07060b;
      --ink:#f4efe4;
      --dim:#9c93a8;
      --faint:#6c6478;
      --line:rgba(244,239,228,.14);
      --line-2:rgba(244,239,228,.26);
      --accent:#b8ff3d;
      --accent-2:#8f7bff;
      --sel:#b8ff3d;
      --stage-glow:rgba(184,255,61,.10);
      --stage-glow-2:rgba(143,123,255,.10);
      color-scheme:dark;
    }
    :root[data-theme="day"]{
      --bg:#edece3;
      --ink:#141318;
      --dim:#5b5566;
      --faint:#847d8e;
      --line:rgba(20,19,24,.18);
      --line-2:rgba(20,19,24,.34);
      --accent:#2f6a00;
      --accent-2:#4b32c4;
      --sel:#2f6a00;
      --stage-glow:rgba(63,122,0,.10);
      --stage-glow-2:rgba(75,50,196,.08);
      color-scheme:light;
    }

    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{
      background:var(--bg);color:var(--ink);font-family:var(--sans);
      -webkit-font-smoothing:antialiased;overflow:hidden;
    }
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
    .skip{position:fixed;left:14px;top:-60px;z-index:60;padding:7px 11px;background:var(--bg);border:1px solid var(--ink);color:var(--ink)}
    .skip:focus{top:14px}
    :focus-visible{outline:2px solid var(--sel);outline-offset:4px}

    .app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;position:relative;overflow:hidden}

    /* ---------- bar ---------- */
    .bar{
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      padding:11px clamp(14px,3vw,40px);border-bottom:1px solid var(--line);
      font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
      white-space:nowrap;min-width:0;z-index:20;
    }
    .bar-l,.bar-r{display:flex;align-items:center;gap:12px;min-width:0}
    .mark{
      display:inline-grid;place-items:center;width:21px;height:21px;flex:none;
      border:1px solid var(--line-2);color:var(--accent);font-size:9px;letter-spacing:0;
    }
    .bar b{color:var(--ink);font-weight:400}
    .bar .sl{color:var(--faint)}
    .bar a:hover{color:var(--accent)}
    .th{
      display:inline-flex;align-items:center;gap:7px;color:var(--dim);
      font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    }
    .th .d{position:relative;width:12px;height:12px;border-radius:50%;border:1px solid currentColor;overflow:hidden;flex:none}
    .th .d::after{content:"";position:absolute;inset:0;background:var(--accent);clip-path:inset(0 0 50% 0);transition:clip-path .45s cubic-bezier(.2,.8,.2,1)}
    :root[data-theme="day"] .th .d::after{clip-path:inset(50% 0 0 0)}

    /* ---------- stage ---------- */
    .stage{
      position:relative;min-height:0;overflow:hidden;
      background:
        radial-gradient(60% 70% at 50% 46%, var(--stage-glow), transparent 68%),
        radial-gradient(45% 55% at 78% 70%, var(--stage-glow-2), transparent 70%),
        var(--bg);
      touch-action:pan-y;
      cursor:grab;
    }
    .stage::after{
      content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(78% 72% at 50% 55%, transparent 38%, rgba(0,0,0,.5) 100%);
    }
    :root[data-theme="day"] .stage::after{
      background:radial-gradient(78% 72% at 50% 55%, transparent 42%, rgba(20,19,24,.10) 100%);
    }
    .stage.grabbing{cursor:grabbing}
    .cable{
      position:absolute;left:50%;top:0;width:1px;
      height:calc(52% - clamp(48px,4.7vw,73px));
      background:linear-gradient(to bottom,rgba(244,239,228,.26),rgba(244,239,228,.05));
      pointer-events:none;
    }
    .ball{
      position:absolute;left:50%;top:52%;width:clamp(96px,9.4vw,146px);aspect-ratio:1;
      transform:translate(-50%,-50%);
      border-radius:50%;z-index:45;pointer-events:none;
      background:
        radial-gradient(circle at 36% 28%, rgba(255,255,255,.5), rgba(255,255,255,0) 36%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.13) 0 1px, transparent 1px 9px),
        repeating-linear-gradient(90deg, rgba(255,255,255,.11) 0 1px, transparent 1px 9px),
        radial-gradient(circle at 50% 40%, #9aa0b6, #44485a 46%, #14151d 80%);
      box-shadow:
        inset -14px -18px 34px rgba(0,0,0,.55),
        0 0 70px rgba(184,255,61,.16),
        0 24px 60px rgba(0,0,0,.45);
      opacity:.92;
    }
    :root[data-theme="day"] .ball{
      background:
        radial-gradient(circle at 36% 28%, rgba(255,255,255,.9), rgba(255,255,255,0) 38%),
        repeating-linear-gradient(0deg, rgba(20,19,24,.12) 0 1px, transparent 1px 9px),
        repeating-linear-gradient(90deg, rgba(20,19,24,.1) 0 1px, transparent 1px 9px),
        radial-gradient(circle at 50% 38%, #f2f2f0, #c3c4c4 48%, #8d8e90 82%);
      box-shadow:inset -14px -18px 34px rgba(0,0,0,.18), 0 14px 34px rgba(20,19,24,.22);
    }
    .ball::after{
      content:"";position:absolute;inset:0;border-radius:50%;
      background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.55), transparent 34%);
    }
    .ball::before{
      content:"";position:absolute;left:50%;top:-14px;width:26px;height:14px;
      transform:translateX(-50%);
      border:1px solid rgba(244,239,228,.24);border-bottom:0;
      border-radius:14px 14px 0 0;
    }

    .sign{
      position:absolute;left:50%;top:clamp(10px,4.5vh,46px);transform:translateX(-50%);
      margin:0;width:100%;text-align:center;
      font-family:var(--serif);font-weight:700;text-transform:uppercase;
      font-size:clamp(22px,3.4vw,46px);letter-spacing:.34em;text-indent:.34em;
      color:transparent;-webkit-text-stroke:1px var(--line-2);
      opacity:.55;pointer-events:none;user-select:none;
    }

    .ring{position:absolute;inset:0}

    .rec{
      position:absolute;left:0;top:0;width:var(--rs,118px);
      display:flex;flex-direction:column;align-items:center;gap:9px;
      will-change:transform,opacity;
      transform-origin:calc(var(--rs,118px) / 2) calc(var(--rs,118px) / 2);
      -webkit-user-drag:none;user-select:none;
    }
    .disc{
      position:relative;width:var(--rs,118px);height:var(--rs,118px);border-radius:50%;flex:none;
      background:
        radial-gradient(circle at 34% 28%, rgba(255,255,255,.14), transparent 42%),
        repeating-radial-gradient(circle at 50% 50%, #17151c 0 1.6px, #0d0c11 1.6px 3.2px),
        #0b0a0f;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.14),
        inset 0 0 22px rgba(0,0,0,.75),
        0 16px 34px rgba(0,0,0,.55);
      display:grid;place-items:center;
      transition:box-shadow .25s, transform .25s;
    }
    .disc::before{
      content:"";position:absolute;inset:0;border-radius:50%;
      background:conic-gradient(from 210deg, transparent 0 30deg, rgba(255,255,255,.08) 42deg, transparent 60deg 200deg, rgba(255,255,255,.05) 216deg, transparent 240deg);
      pointer-events:none;
    }
    .lbl{
      position:relative;display:grid;place-items:center;
      width:46px;height:46px;border-radius:50%;
      background:var(--rec,var(--accent));color:#0b0a0f;
      box-shadow:0 0 0 3px rgba(0,0,0,.5), 0 0 12px color-mix(in srgb,var(--rec,var(--accent)) 30%,transparent);
    }
    .lbl .ini{font-family:var(--serif);font-weight:700;font-size:24px;line-height:1;transform:translateY(-1px)}
    .lbl .pin{
      position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;
      border-radius:50%;background:#0b0a0f;box-shadow:0 0 0 1px rgba(255,255,255,.2);
    }
    .nm{
      font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
      color:var(--dim);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;
      opacity:.9;
    }
    .rec.front .disc{
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.2),
        inset 0 0 26px rgba(0,0,0,.7),
        0 0 0 2px var(--rec,var(--accent)),
        0 0 44px color-mix(in srgb,var(--rec,var(--accent)) 40%,transparent),
        0 22px 40px rgba(0,0,0,.55);
      transform:translateY(-4px);
    }
    .rec.front .nm{color:var(--ink);opacity:1}
    .rec:hover .disc{transform:translateY(-5px)}
    .rec:hover .nm{color:var(--ink)}
    .rec.front .disc{animation:play 7s linear infinite}
    @keyframes play{from{transform:translateY(-4px) rotate(0)}to{transform:translateY(-4px) rotate(360deg)}}
    .rec.front:hover .disc{animation-play-state:paused}

    /* ---------- now playing ---------- */
    .np{
      position:relative;z-index:20;
      display:grid;grid-template-columns:minmax(0,1fr) auto;
      align-items:center;gap:clamp(16px,3vw,44px);
      padding:13px clamp(14px,3vw,40px) 15px;
      border-top:1px solid var(--line);background:var(--bg);
    }
    .np-main{min-width:0}
    .kick{
      display:flex;align-items:center;gap:10px;margin:0 0 8px;
      font-family:var(--mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--sel);
    }
    .kick::before{content:"";width:22px;height:1px;background:currentColor}
    .kick .n{color:var(--faint);letter-spacing:.12em}
    .np h1{
      margin:0;font-family:var(--serif);font-weight:700;text-transform:uppercase;
      font-size:clamp(26px,3.1vw,46px);line-height:.92;letter-spacing:-.02em;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .note{
      margin:7px 0 0;max-width:82ch;font-size:12.5px;line-height:1.45;color:var(--dim);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .np-r{display:flex;align-items:center;gap:clamp(10px,1.6vw,22px);flex-wrap:wrap;justify-content:flex-end}
    .tags{display:flex;flex-wrap:wrap;gap:6px;margin:0}
    .tag{
      font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
      padding:3px 7px;border:1px solid var(--line-2);color:var(--dim);
    }
    .tag.sel{color:var(--sel);border-color:color-mix(in srgb,var(--sel) 55%,transparent)}
    .open{
      display:inline-flex;align-items:center;gap:11px;
      font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
      color:var(--ink);border-bottom:1px solid var(--line-2);padding-bottom:5px;white-space:nowrap;
    }
    .open .ar{color:var(--sel);transition:transform .25s}
    .open:hover{color:var(--sel);border-color:var(--sel)}
    .open:hover .ar{transform:translateX(4px)}

    /* ---------- foot ---------- */
    .foot{
      display:flex;align-items:center;justify-content:space-between;gap:18px;
      padding:9px clamp(14px,3vw,40px);border-top:1px solid var(--line);
      font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
      white-space:nowrap;z-index:20;
    }
    .foot a:hover{color:var(--accent)}
    .foot .mid{color:var(--dim)}
    .foot b{font-weight:400;color:var(--dim)}
    .hint-t{display:none}

    /* ---------- responsive ---------- */
    @media (max-width:1080px){
      .np h1{font-size:clamp(24px,3.6vw,38px)}
    }
    @media (max-width:820px){
      body{overflow:auto}
      .app{height:auto;min-height:100dvh;grid-template-rows:auto auto auto auto}
      .stage{height:52dvh;min-height:380px;order:1}
      .np{grid-template-columns:1fr;gap:10px;padding:16px 18px 20px;order:2}
      .np h1{white-space:normal;font-size:clamp(34px,9vw,48px)}
      .note{white-space:normal;max-width:none}
      .np-r{justify-content:flex-start}
      .lbl{width:34px;height:34px}
      .lbl .ini{font-size:18px}
      .nm{display:none}
      .foot{order:3;flex-wrap:wrap;gap:4px 14px;white-space:normal}
      .foot .mid{display:none}
      .hint-k{display:none}
      .hint-t{display:inline}
      .sign{left:50%;letter-spacing:.14em;text-indent:.14em;font-size:clamp(16px,5.4vw,26px);top:18px}
      .bar{font-size:9px;letter-spacing:.12em;padding:9px 14px}
      .bar .opt{display:none}
      .ball,.cable{left:50%}
      .ball{width:86px}
      .cable{height:calc(52% - 43px)}
    }
    @media (prefers-reduced-motion:reduce){
      *{animation:none!important;transition:none!important}
    }
  </style>
</head>
<body>
  <a class="skip" href="#panel">Skip to the record</a>

  <div class="app">
    <header class="bar">
      <div class="bar-l">
        <a class="mark" href="/" aria-label="Harmonizer Labs home">HL</a>
        <b>Harmonizer Labs</b>
        <span class="sl" aria-hidden="true">/</span>
        <span>The Crate</span>
        <span class="sl opt" aria-hidden="true">/</span>
        <span class="opt">Run 06</span>
      </div>
      <div class="bar-r">
        <span class="opt" id="count">19 records</span>
        <a class="opt" href="/collections">Runs</a>
        <button class="th" id="theme" type="button" aria-label="Switch to daylight">
          <span class="d" aria-hidden="true"></span>
          <span id="thlabel">Night</span>
        </button>
      </div>
    </header>

    <main class="stage" id="stage" aria-label="The crate: nineteen records">
      <div class="cable" aria-hidden="true"></div>
      <div class="ball" aria-hidden="true"></div>
      <p class="sign" aria-hidden="true">Internet Discotheque</p>
      <div class="ring" id="ring"></div>
    </main>

    <section class="np" id="panel" aria-label="Selected record">
      <div class="np-main">
        <p class="kick">Now loaded <span class="n" id="no">01 / 19</span></p>
        <h1 id="name">Music Lab</h1>
        <p class="note" id="note"></p>
      </div>
      <div class="np-r">
        <p class="tags"><span class="tag sel" id="col">Sound</span><span class="tag" id="gate">Open</span></p>
        <a class="open" id="open" href="/musiclab"><span>Open record</span> <span class="ar" aria-hidden="true">&rarr;</span></a>
      </div>
    </section>

    <footer class="foot">
      <span class="hint-k">Drag to spin · <b>&larr;</b> <b>&rarr;</b> step · Enter open</span>
      <span class="hint-t">Drag to spin · tap a record</span>
      <span class="mid">Run 06 · nineteen records, one crate</span>
      <span><a href="/collections">All six runs</a> · harmonizerlabs.cc</span>
    </footer>
  </div>

  <script src="/js/collections-data.js"></script>
  <script>
    (function () {
      'use strict';

      const { collections = [], items = [], gates = {} } = window.HL_COLLECTIONS || {};
      const stage = document.getElementById('stage');
      const ring = document.getElementById('ring');
      const root = document.documentElement;
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const pad = (n) => String(n).padStart(2, '0');
      const colName = (id) => (collections.find((c) => c.id === id) || {}).name || id;
      const N = items.length || 1;
      const STEP = (Math.PI * 2) / N;
      const BASE = items.map((_, i) => i * STEP);

      document.getElementById('count').textContent = N + ' records';
      document.getElementById('no').textContent = '01 / ' + pad(N);

      /* ---------- build the crate ---------- */
      const recs = items.map((it, i) => {
        const a = document.createElement('a');
        a.className = 'rec';
        a.href = it.href;
        a.dataset.i = String(i);
        a.style.setProperty('--rec', it.accent || '#b8ff3d');
        a.setAttribute('aria-label', it.name + ' — ' + (gates[it.gate] || it.gate));
        const initial = (it.name || '?').trim().charAt(0).toUpperCase();
        a.innerHTML =
          '<span class="disc"><span class="lbl"><span class="ini">' + esc(initial) + '</span>' +
          '<span class="pin" aria-hidden="true"></span></span></span>' +
          '<span class="nm">' + esc(it.name) + '</span>';
        ring.appendChild(a);
        a.nmEl = a.querySelector('.nm');
        a.addEventListener('focus', () => spinTo(i));
        return a;
      });

      function spinTo(i) {
        const off = Math.round((spin + BASE[i]) / (Math.PI * 2));
        target = -BASE[i] + off * Math.PI * 2;
      }

      /* ---------- panel ---------- */
      const pno = document.getElementById('no');
      const pname = document.getElementById('name');
      const pnote = document.getElementById('note');
      const pcol = document.getElementById('col');
      const pgate = document.getElementById('gate');
      const popen = document.getElementById('open');
      let front = -1;

      function paintSel() {
        const it = items[front];
        if (!it) return;
        const accent = it.accent || '#b8ff3d';
        stage.style.setProperty('--sel', root.dataset.theme === 'day'
          ? 'color-mix(in srgb, ' + accent + ' 38%, #141318)'
          : accent);
      }

      function setFront(i) {
        if (i === front || !items[i]) return;
        front = i;
        const it = items[i];
        pno.textContent = pad(i + 1) + ' / ' + pad(N);
        pname.textContent = it.name;
        pnote.textContent = it.note || '';
        pcol.textContent = colName(it.collection);
        pgate.textContent = gates[it.gate] || it.gate;
        popen.href = it.href;
        popen.setAttribute('aria-label', 'Open ' + it.name);
        paintSel();
        recs.forEach((r, j) => r.classList.toggle('front', i === j));
      }

      /* ---------- motion ---------- */
      let spin = 0;
      let vel = 0;
      let target = null;
      let idle = 0;
      let dragging = false;
      let moved = 0;
      let lastX = 0;
      let lastT = 0;
      let hovering = false;
      let last = performance.now();
      let holding = false;

      const snap = (v) => Math.round(v / STEP) * STEP;

      /* dir +1 = the next record in the manifest */
      function stepTo(dir) {
        target = (target != null ? target : snap(spin)) - dir * STEP;
        idle = 0;
      }

      function frame(now) {
        const dt = Math.min(50, now - last);
        last = now;

        if (dragging) {
          /* pointermove drives the spin */
        } else if (target != null) {
          const d = target - spin;
          spin += d * Math.min(1, dt * 0.0075);
          if (Math.abs(d) < 0.002) { spin = target; target = null; idle = 0; }
        } else {
          idle += dt;
          if (idle > 4200 && !hovering && !holding && !reduce.matches) stepTo(1);
        }

        const W = stage.clientWidth;
        const H = stage.clientHeight;
        const wide = W > 820;
        const rs = wide ? 118 : 84;
        if (ring.dataset.rs !== String(rs)) {
          ring.style.setProperty('--rs', rs + 'px');
          ring.dataset.rs = String(rs);
        }
        const R = wide ? Math.min(W * 0.34, H * 0.6, 500) : Math.min(W * 0.37, 160);
        const cx = W * (wide ? 0.5 : 0.5);
        const cy = H * (wide ? 0.52 : 0.52);
        const flat = wide ? 0.26 : 0.42;

        let best = -2;
        let bestI = 0;

        for (let i = 0; i < N; i++) {
          const el = recs[i];
          if (!el) continue;
          const a = BASE[i] + spin;
          const c = Math.cos(a);
          const s = Math.sin(a);
          const k = (c + 1) / 2;
          const bob = (reduce.matches || hovering) ? 0 : Math.sin(now * 0.0009 + i * 1.7) * 2.5;
          const x = cx + R * s - rs / 2;
          const y = cy + R * flat * c + bob - rs / 2;

          el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) scale(' + (0.62 + 0.44 * k).toFixed(3) + ')';
          const floor = root.dataset.theme === 'day' ? 0.42 : 0.16;
          el.style.opacity = (floor + (1 - floor) * Math.pow(k, 1.25)).toFixed(3);
          el.style.zIndex = String(1 + Math.round(k * 100));
          el.style.pointerEvents = k > 0.55 ? 'auto' : 'none';
          if (el.nmEl) el.nmEl.style.opacity = k < 0.46 ? '0' : String(Math.min(1, (k - 0.46) * 3.4)).slice(0, 4);

          if (c > best) { best = c; bestI = i; }
        }

        setFront(bestI);
        requestAnimationFrame(frame);
      }

      /* ---------- drag ----------
         Pointer capture is deferred until the pointer actually moves, so a plain
         click still lands on the record link instead of the stage. */
      let tracking = false;
      let downRec = null;

      stage.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        downRec = e.target.closest ? e.target.closest('.rec') : null;
        tracking = true;
        dragging = false;
        target = null;
        moved = 0;
        lastX = e.clientX;
        lastT = e.timeStamp;
        vel = 0;
      });

      stage.addEventListener('pointermove', (e) => {
        if (!tracking) return;
        const dx = e.clientX - lastX;
        const dt = Math.max(1, e.timeStamp - lastT);
        lastX = e.clientX;
        lastT = e.timeStamp;
        moved += Math.abs(dx);
        if (!dragging && moved > 6) {
          dragging = true;
          stage.classList.add('grabbing');
          if (stage.setPointerCapture) { try { stage.setPointerCapture(e.pointerId); } catch (err) {} }
        }
        if (!dragging) return;
        spin += dx * 0.0062;
        vel = Math.max(-0.02, Math.min(0.02, (dx * 0.0062) / dt));
      });

      function swallowClick() {
        const swallow = (ev) => { ev.preventDefault(); ev.stopPropagation(); };
        ring.addEventListener('click', swallow, true);
        setTimeout(() => ring.removeEventListener('click', swallow, true), 80);
      }

      function endDrag(e, commit) {
        if (!tracking) return;
        tracking = false;
        const rec = downRec;
        downRec = null;
        if (!dragging) {
          /* The crate can still be easing, so the record under the pointer at
             press time is the one that counts. */
          if (commit && rec && moved <= 8 && e.button === 0 &&
              !e.ctrlKey && !e.metaKey && !e.shiftKey && !e.altKey) {
            swallowClick();
            window.location.href = rec.href;
          }
          return;
        }
        dragging = false;
        hovering = false;
        stage.classList.remove('grabbing');
        if (stage.releasePointerCapture && e.pointerId != null) {
          try { stage.releasePointerCapture(e.pointerId); } catch (err) {}
        }
        if (moved > 8) {
          target = snap(spin + vel * 200);
          swallowClick();
        }
      }
      stage.addEventListener('pointerup', (e) => endDrag(e, true));
      stage.addEventListener('pointercancel', (e) => endDrag(e, false));
      stage.addEventListener('dragstart', (e) => e.preventDefault());

      /* ---------- wheel (desktop only) ---------- */
      stage.addEventListener('wheel', (e) => {
        if (window.innerWidth <= 820) return;
        e.preventDefault();
        stepTo(e.deltaY > 0 ? 1 : -1);
      }, { passive: false });

      /* ---------- hover pause ---------- */
      ring.addEventListener('pointerover', (e) => { if (e.target.closest('.rec')) hovering = true; });
      ring.addEventListener('pointerout', (e) => { if (e.target.closest('.rec')) hovering = false; });
      panel.addEventListener('focusin', () => { holding = true; });
      panel.addEventListener('focusout', () => { holding = false; });

      /* ---------- keyboard ---------- */
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') { e.preventDefault(); stepTo(1); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); stepTo(-1); }
        else if (e.key === 'Enter' && document.activeElement === document.body) {
          const it = items[front];
          if (it) window.location.href = it.href;
        }
      });

      /* ---------- theme ---------- */
      function paintTheme() {
        const day = root.dataset.theme === 'day';
        document.getElementById('thlabel').textContent = day ? 'Day' : 'Night';
        document.getElementById('theme').setAttribute('aria-label',
          day ? 'Switch to night' : 'Switch to daylight');
      }
      document.getElementById('theme').addEventListener('click', () => {
        const next = root.dataset.theme === 'day' ? 'night' : 'day';
        root.dataset.theme = next;
        try { localStorage.setItem('hl-theme', next === 'day' ? 'light' : 'dark'); } catch (err) {}
        paintTheme();
        paintSel();
      });
      paintTheme();

      setFront(0);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
