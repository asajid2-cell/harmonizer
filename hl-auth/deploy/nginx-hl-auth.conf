# nginx — add inside the existing `server { ... }` block for harmonizerlabs.cc
# (the same server that already proxies /cloud-squeeze and /mediamtx).
#
# IMPORTANT: only /auth/ is exposed. There is deliberately NO location for
# /internal/ — the verify endpoint must never be reachable from the internet.
# Sibling apps call it directly at http://127.0.0.1:4200/internal/verify.

location /auth/ {
    proxy_pass http://127.0.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
