# hl-auth service — add this service to the existing lms-vps compose stack
# (or run it standalone). Uses host networking to match the other services, so
# it binds 127.0.0.1:4200 (nginx + sibling containers reach it via localhost).
#
# Secrets come from /home/harmonizer/lms-vps/.env — NEVER hard-code them here.
services:
  hl-auth:
    build:
      context: ../hl-auth          # path to the hl-auth project on the VPS
    container_name: hl-auth
    restart: unless-stopped
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: 4200
      BASE_PATH: /auth
      COOKIE_NAME: hl_session
      COOKIE_DOMAIN: ""            # host-only cookie -> shared across all /paths on harmonizerlabs.cc
      COOKIE_SECURE: 1
      SESSION_TTL_DAYS: 90
      INVITE_TTL_HOURS: 24
      DB_PATH: /data/hl-auth.db
      SEED_PAGES: "cloud-squeeze:Cloud Squeeze:/cloud-squeeze,watch-together:Watch Together:/mediamtx,main:Main Site:/"
      INTERNAL_KEY: ${HL_AUTH_INTERNAL_KEY:?set HL_AUTH_INTERNAL_KEY in .env}
      BOOTSTRAP_ADMIN_USERNAME: ${HL_AUTH_ADMIN_USER:-owner}
      BOOTSTRAP_ADMIN_PASSWORD: ${HL_AUTH_ADMIN_PASS:?set HL_AUTH_ADMIN_PASS in .env}
      MASTER_PASSWORD: ${HL_AUTH_MASTER_PASS:-}
      TRUST_PROXY: 1
    volumes:
      - ./data/hl-auth:/data
