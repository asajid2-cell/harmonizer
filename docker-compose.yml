services:
  harmonizer:
    container_name: harmonizer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build: .
    image: harmonizer:prod
    env_file:
      - .env
    environment:
      - CODESNIFF_BACKEND_URL=http://codesniff:8000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./uploads:/app/backend/uploads
      - ./data:/app/backend/data
      - ./audiobooks:/app/audiobooks
      - ./backend/ourspace_data:/app/backend/ourspace_data
    restart: unless-stopped
    depends_on:
      - codesniff
    # Resource limits for 2GB RAM VPS
    deploy:
      resources:
        limits:
          memory: 999M
          cpus: '0.7' 
        reservations:
          memory: 128M
          cpus: '0.15'

  codesniff:
    container_name: codesniff
    build: ./codesniff/backend
    image: codesniff:prod
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - codesniff_storage:/app/storage
    environment:
      - CODESCOPE_STORAGE_DIR=/app/storage
      - CODESCOPE_LOG_FILE=/tmp/codescope.log
    restart: unless-stopped
    # Untrusted input (cloned repos, uploads) must land somewhere it cannot run, as a
    # user that cannot matter. read_only rootfs + noexec tmpfs + zero caps.
    user: "1102:1102"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1200M  # CodeBERT needs ~800MB to load
          cpus: '0.5'
        reservations:
          memory: 768M
          cpus: '0.25'

  # watchtower REMOVED (fleet hardening): it mounted /var/run/docker.sock = full host-root
  # authority, yet could never do its job -- `harmonizer:prod` is a LOCALLY BUILT image with no
  # registry repo, so every run logged "pull access denied for harmonizer, repository does not
  # exist", Updated=0. Worse, it resolved that unqualified name to docker.io/library/harmonizer,
  # a repo we do not own: if anyone ever published that public name, watchtower would have pulled
  # a stranger's image and deployed it as the public site, as root. Zero benefit, full authority.
  # Deploy harmonizer manually instead:  docker compose up -d --build harmonizer

volumes:
  codesniff_storage:
